name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardfitsg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Workflow policy
        run: node tools/test-workflow.mjs
      - name: Recommendation engine tests
        run: node tools/test-engine.mjs
      - name: Catalog freshness policy tests
        run: node tools/test-catalog-freshness.mjs
      - name: Catalog review deadline
        run: node tools/catalog-freshness.mjs
      - name: Static site integrity
        run: node tools/test-site.mjs
      - name: App startup and rendering
        run: node tools/test-app.mjs
      - name: JavaScript syntax
        run: node --check js/*.js
