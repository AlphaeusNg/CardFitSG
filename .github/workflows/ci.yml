name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recommendation engine tests
        run: node tools/test-engine.mjs
      - name: Static site integrity
        run: node tools/test-site.mjs
      - name: App startup and rendering
        run: node tools/test-app.mjs
      - name: JavaScript syntax
        run: node --check js/*.js
